name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: 解压 gunmu-town.zip
      run: |
        mkdir -p _extract
        unzip -q gunmu-town.zip -d _extract
        if [ -d "_extract/gunmu-town" ]; then
          cp -r _extract/gunmu-town/. .
        else
          cp -r _extract/. .
        fi
        rm -rf _extract

    - name: 环境诊断
      run: |
        echo "=== 根目录 ==="
        ls -la
        echo ""
        echo "=== settings.gradle ==="
        cat settings.gradle 2>/dev/null || echo "无"
        echo ""
        echo "=== 根 build.gradle ==="
        cat build.gradle 2>/dev/null || echo "无"
        echo ""
        echo "=== app/build.gradle ==="
        cat app/build.gradle 2>/dev/null || echo "无"

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 下载 Gradle 8.2
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip
        echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH

    - name: 配置 Android 环境
      run: |
        SDK=/usr/local/lib/android/sdk
        echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
        echo "sdk.dir=$SDK" > local.properties

    - name: 安装 Android SDK 包
      run: |
        SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
        yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
        $SDKMANAGER "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5
        echo "=== 已安装的包 ==="
        $SDKMANAGER --list_installed 2>/dev/null | tail -20 || true

    - name: 构建 APK
      run: gradle assembleDebug --no-daemon --stacktrace --info 2>&1 | tail -100

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: gunmu-town-apk
        path: app/build/outputs/apk/debug/app-debug.apk
