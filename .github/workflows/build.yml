name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: 解压 gunmu-town.zip
      run: |
        mkdir -p _extract
        unzip -q gunmu-town.zip -d _extract
        if [ -d "_extract/gunmu-town" ]; then
          cp -r _extract/gunmu-town/. .
        else
          cp -r _extract/. .
        fi
        rm -rf _extract

    - name: 修复代码问题
      run: |
        SCREEN_DIR=app/src/main/java/com/gunmu/town/screen
        DATA_DIR=app/src/main/java/com/gunmu/town/data
        UI_FILE=app/src/main/java/com/gunmu/town/util/UI.java

        echo "===== 1. 强制改名 Simplescreen.java ====="
        find app/src/main/java -type f -iname "simplescreen.java" | while read f; do
          dir=$(dirname "$f")
          target="$dir/SimpleScreen.java"
          if [ "$f" != "$target" ]; then
            mv "$f" "$target"
            echo "  已改名: $f"
            echo "       ->  $target"
          fi
        done

        echo ""
        echo "===== 2. 打印 Save.java 240-260 行（含行号）====="
        SAVE_FILE="$DATA_DIR/Save.java"
        if [ -f "$SAVE_FILE" ]; then
          awk 'NR>=240 && NR<=260 { printf "%4d: %s\n", NR, $0 }' "$SAVE_FILE"
        else
          echo "  Save.java 不存在"
        fi

        echo ""
        echo "===== 3. RaidScreen 补 import ====="
        RAID_FILE=$(find "$SCREEN_DIR" -iname "raidscreen.java" | head -1)
        if [ -n "$RAID_FILE" ]; then
          if ! grep -q "import android.widget.LinearLayout;" "$RAID_FILE"; then
            sed -i '0,/^import android.widget.FrameLayout;/s//import android.widget.FrameLayout;\nimport android.widget.LinearLayout;/' "$RAID_FILE"
          fi
          if ! grep -q "import android.graphics.RectF;" "$RAID_FILE"; then
            sed -i '0,/^import android.graphics.Paint;/s//import android.graphics.Paint;\nimport android.graphics.RectF;/' "$RAID_FILE"
          fi
          if ! grep -q "import android.view.Gravity;" "$RAID_FILE"; then
            sed -i '0,/^import android.view.MotionEvent;/s//import android.view.Gravity;\nimport android.view.MotionEvent;/' "$RAID_FILE"
          fi
          sed -i 's|GameData\.Enemy target = null;|Enemy target = null;|g' "$RAID_FILE"
        fi

        echo ""
        echo "===== 4. UI.java 补 GameState import ====="
        if ! grep -q "import com.gunmu.town.data.GameState" "$UI_FILE"; then
          sed -i 's|^import com.gunmu.town.MainActivity;|import com.gunmu.town.MainActivity;\nimport com.gunmu.town.data.GameState;|' "$UI_FILE"
        fi

        echo ""
        echo "===== 5. SimpleScreen 去掉 final ====="
        SIMPLE_FILE=$(find "$SCREEN_DIR" -iname "simplescreen.java" | head -1)
        if [ -n "$SIMPLE_FILE" ]; then
          sed -i 's|private final GameState s;|private GameState s;|' "$SIMPLE_FILE"
        fi

        echo ""
        echo "===== 修复后的所有 java 文件 ====="
        find app/src/main/java -name "*.java" -type f | sort

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 下载 Gradle 8.2
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip
        echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH

    - name: 配置 Android 环境
      run: |
        SDK=/usr/local/lib/android/sdk
        echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
        echo "sdk.dir=$SDK" > local.properties

    - name: 安装 Android SDK 包
      run: |
        SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
        yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
        $SDKMANAGER "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

    - name: 构建 APK
      run: |
        set +e
        gradle assembleDebug --no-daemon --console=plain > gradle.log 2>&1
        STATUS=$?

        echo ""
        echo "############################################"
        echo "# 编译错误清单（共 $(grep -c 'error:' gradle.log) 条）"
        echo "############################################"
        grep "error:" gradle.log | sed 's|/home/runner/work/gunmu-town1/gunmu-town1/||' | head -60
        echo "############################################"
        echo ""
        echo "构建状态：$STATUS（0=成功）"
        exit $STATUS

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: gunmu-town-apk
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          **/*.apk
        if-no-files-found: warn
