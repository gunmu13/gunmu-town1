name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: 解压 gunmu-town.zip
      run: |
        mkdir -p _extract
        unzip -q gunmu-town.zip -d _extract
        if [ -d "_extract/gunmu-town" ]; then
          cp -r _extract/gunmu-town/. .
        else
          cp -r _extract/. .
        fi
        rm -rf _extract

    - name: 自动修复代码 bug
      run: |
        SCREEN_DIR=app/src/main/java/com/gunmu/town/screen
        UI_FILE=app/src/main/java/com/gunmu/town/util/UI.java

        if ! grep -q "import com.gunmu.town.data.GameState" "$UI_FILE"; then
          sed -i 's|^import com.gunmu.town.MainActivity;|import com.gunmu.town.MainActivity;\nimport com.gunmu.town.data.GameState;|' "$UI_FILE"
        fi

        SIMPLE_FILE=$(find "$SCREEN_DIR" -iname "simplescreen.java" | head -1)
        if [ -n "$SIMPLE_FILE" ]; then
          sed -i 's|private final GameState s;|private GameState s;|' "$SIMPLE_FILE"
        fi

        RAID_FILE=$(find "$SCREEN_DIR" -iname "raidscreen.java" | head -1)
        if [ -n "$RAID_FILE" ]; then
          sed -i 's|GameData\.Enemy target = null;|Enemy target = null;|g' "$RAID_FILE"
        fi

        echo "修复完成"

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 下载 Gradle 8.2
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip
        echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH

    - name: 配置 Android 环境
      run: |
        SDK=/usr/local/lib/android/sdk
        echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
        echo "sdk.dir=$SDK" > local.properties

    - name: 安装 Android SDK 包
      run: |
        SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
        yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
        $SDKMANAGER "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

    - name: 构建 APK
      id: build
      run: |
        set +e
        gradle assembleDebug --no-daemon --console=plain 2>&1 | tee gradle.log
        STATUS=$?
        echo "gradle 退出码: $STATUS"
        echo "build_status=$STATUS" >> $GITHUB_OUTPUT

        echo ""
        echo "============ gradle 日志最后 30 行 ============"
        tail -30 gradle.log

        echo ""
        echo "============ BUILD 关键字统计 ============"
        grep -c "BUILD SUCCESSFUL" gradle.log && echo "找到 SUCCESSFUL" || echo "没找到 SUCCESSFUL"
        grep -c "BUILD FAILED" gradle.log && echo "找到 FAILED" || echo "没找到 FAILED"
        grep -c "error:" gradle.log && echo "有编译错误" || echo "没有编译错误"

        exit $STATUS

    - name: 深度查找 APK
      if: always()
      run: |
        echo "============ 全仓库找 apk ============"
        find . -name "*.apk" -type f 2>/dev/null | head -20 || echo "0 个 apk"

        echo ""
        echo "============ app/build 完整目录树 ============"
        find app/build -type d 2>/dev/null | head -40 || echo "app/build 不存在"

        echo ""
        echo "============ app/build 所有文件 ============"
        find app/build -type f 2>/dev/null | head -40 || echo "app/build 无文件"

        echo ""
        echo "============ app/build/outputs 详细 ============"
        ls -laR app/build/outputs/ 2>/dev/null || echo "app/build/outputs 不存在"

        echo ""
        echo "============ 检查 gradle 是否生成了 apk 任务 ============"
        grep -i "packageDebug\|assembleDebug\|Package.*Debug" gradle.log | head -20 || echo "gradle.log 无打包任务记录"

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: gunmu-town-apk
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/**/*.apk
          app/build/**/*.apk
          **/*.apk
        if-no-files-found: warn
