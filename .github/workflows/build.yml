name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: 打印当前目录
      run: ls -la

    - name: 解压 gunmu-town.zip
      run: |
        mkdir -p _extract
        unzip -q gunmu-town.zip -d _extract
        echo "=== 解压出的内容 ==="
        find _extract -maxdepth 3 -type d
        echo "---"
        find _extract -maxdepth 3 -type f | head -40

        # 自动识别项目根目录
        if [ -f "_extract/settings.gradle" ]; then
          cp -r _extract/. .
        elif [ -f "_extract/package.json" ]; then
          cp -r _extract/. .
        elif [ -d "_extract/gunmu-town" ]; then
          cp -r _extract/gunmu-town/. .
        else
          # 深层搜索
          found=$(find _extract -name "settings.gradle" -o -name "package.json" | head -1)
          if [ -n "$found" ]; then
            cp -r "$(dirname "$found")"/. .
          fi
        fi
        rm -rf _extract
        echo "=== 处理后根目录 ==="
        ls -la

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - uses: actions/setup-node@v4
      if: hashFiles('package.json') != ''
      with:
        node-version: '20'

    - name: 设置 Android 环境
      run: |
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

    - name: 判断项目类型
      id: type
      run: |
        if [ -f "settings.gradle" ]; then
          echo "type=android" >> $GITHUB_OUTPUT
        elif [ -f "package.json" ]; then
          echo "type=capacitor" >> $GITHUB_OUTPUT
        else
          echo "type=unknown" >> $GITHUB_OUTPUT
        fi

    - name: 下载 Gradle 8.2
      if: steps.type.outputs.type == 'android'
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip
        echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH

    - name: 接受 Android 许可
      run: |
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: 构建 Android 原生项目
      if: steps.type.outputs.type == 'android'
      run: gradle assembleDebug --no-daemon --stacktrace

    - name: 构建 Capacitor 项目
      if: steps.type.outputs.type == 'capacitor'
      run: |
        npm install
        npx cap add android
        npx cap sync android
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: gunmu-town-apk
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          android/app/build/outputs/apk/debug/app-debug.apk
