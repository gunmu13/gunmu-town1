name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: 解压 gunmu-town.zip
      run: |
        mkdir -p _extract
        unzip -q gunmu-town.zip -d _extract
        if [ -d "_extract/gunmu-town" ]; then
          cp -r _extract/gunmu-town/. .
        else
          cp -r _extract/. .
        fi
        rm -rf _extract

    - name: 自动修复代码 bug
      run: |
        SCREEN_DIR=app/src/main/java/com/gunmu/town/screen
        UI_FILE=app/src/main/java/com/gunmu/town/util/UI.java

        if ! grep -q "import com.gunmu.town.data.GameState" "$UI_FILE"; then
          sed -i 's|^import com.gunmu.town.MainActivity;|import com.gunmu.town.MainActivity;\nimport com.gunmu.town.data.GameState;|' "$UI_FILE"
        fi

        SIMPLE_FILE=$(find "$SCREEN_DIR" -iname "simplescreen.java" | head -1)
        if [ -n "$SIMPLE_FILE" ]; then
          sed -i 's|private final GameState s;|private GameState s;|' "$SIMPLE_FILE"
        fi

        RAID_FILE=$(find "$SCREEN_DIR" -iname "raidscreen.java" | head -1)
        if [ -n "$RAID_FILE" ]; then
          sed -i 's|GameData\.Enemy target = null;|Enemy target = null;|g' "$RAID_FILE"
        fi
        echo "修复完成"

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 下载 Gradle 8.2
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip
        echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH

    - name: 配置 Android 环境
      run: |
        SDK=/usr/local/lib/android/sdk
        echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
        echo "sdk.dir=$SDK" > local.properties

    - name: 安装 Android SDK 包
      run: |
        SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
        yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
        $SDKMANAGER "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

    - name: 构建 APK
      run: |
        set +e
        gradle assembleDebug --no-daemon --console=plain > gradle.log 2>&1
        STATUS=$?

        # 只把纯 error 行提取出来，压缩显示
        echo ""
        echo "############################################"
        echo "# 编译错误清单（共 $(grep -c 'error:' gradle.log) 条）"
        echo "############################################"
        grep "error:" gradle.log | sed 's|/home/runner/work/gunmu-town1/gunmu-town1/||' | sort -u
        echo "############################################"
        echo ""
        echo "构建状态：$STATUS（0=成功）"
        exit $STATUS

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: gunmu-town-apk
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          **/*.apk
        if-no-files-found: warn
