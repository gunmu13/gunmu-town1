name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: 解压 gunmu-town.zip
      run: |
        mkdir -p _extract
        unzip -q gunmu-town.zip -d _extract
        if [ -d "_extract/gunmu-town" ]; then
          cp -r _extract/gunmu-town/. .
        else
          cp -r _extract/. .
        fi
        rm -rf _extract
        echo "=== app 模块文件清单 ==="
        find app -type f 2>/dev/null | head -40

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 下载 Gradle 8.2
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip
        echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH

    - name: 配置 Android 环境
      run: |
        SDK=/usr/local/lib/android/sdk
        echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
        echo "sdk.dir=$SDK" > local.properties

    - name: 安装 Android SDK 包
      run: |
        SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
        yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
        $SDKMANAGER "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

    - name: 列出所有任务
      run: gradle tasks --all --no-daemon 2>&1 | grep -i "assemble" || echo "没有 assemble 相关任务"

    - name: 构建 APK
      run: gradle assembleDebug --no-daemon --console=plain 2>&1 | tee gradle.log

    - name: 检查产物
      if: always()
      run: |
        echo ""
        echo "========== 1. 全仓库找 APK =========="
        find . -name "*.apk" -type f 2>/dev/null || echo "没找到 APK"
        echo ""
        echo "========== 2. app/build 目录 =========="
        ls -la app/build/ 2>/dev/null || echo "app/build 不存在"
        echo ""
        echo "========== 3. app/build/outputs =========="
        ls -laR app/build/outputs/ 2>/dev/null || echo "app/build/outputs 不存在"
        echo ""
        echo "========== 4. gradle 日志最后 40 行 =========="
        tail -40 gradle.log

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: gunmu-town-apk
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/**/*.apk
          **/*.apk
        if-no-files-found: warn
