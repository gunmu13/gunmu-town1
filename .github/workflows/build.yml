name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: 解压 gunmu-town.zip
      run: |
        mkdir -p _extract
        unzip -q gunmu-town.zip -d _extract
        if [ -d "_extract/gunmu-town" ]; then
          cp -r _extract/gunmu-town/. .
        else
          cp -r _extract/. .
        fi
        rm -rf _extract
        echo "=== 实际 java 文件列表 ==="
        find app/src/main/java -name "*.java" -type f

    - name: 自动修复代码 bug
      run: |
        SCREEN_DIR=app/src/main/java/com/gunmu/town/screen
        UI_FILE=app/src/main/java/com/gunmu/town/util/UI.java

        echo "===== 修复 1: UI.java 加 GameState import ====="
        if grep -q "import com.gunmu.town.data.GameState" "$UI_FILE"; then
          echo "GameState import 已存在，跳过"
        else
          sed -i 's|^import com.gunmu.town.MainActivity;|import com.gunmu.town.MainActivity;\nimport com.gunmu.town.data.GameState;|' "$UI_FILE"
          echo "已插入 GameState import"
        fi
        grep -n "import com.gunmu.town.data.GameState" "$UI_FILE" && echo "✓ UI.java OK"

        echo "===== 修复 2: SimpleScreen（自动找大小写）====="
        SIMPLE_FILE=$(find "$SCREEN_DIR" -iname "simplescreen.java" | head -1)
        echo "找到文件: $SIMPLE_FILE"
        if [ -n "$SIMPLE_FILE" ]; then
          sed -i 's|private final GameState s;|private GameState s;|' "$SIMPLE_FILE"
          grep -n "private GameState s;" "$SIMPLE_FILE" && echo "✓ SimpleScreen OK"
        else
          echo "✗ 没找到 SimpleScreen 文件"
        fi

        echo "===== 修复 3: RaidScreen 类型修正 ====="
        RAID_FILE=$(find "$SCREEN_DIR" -iname "raidscreen.java" | head -1)
        echo "找到文件: $RAID_FILE"
        if [ -n "$RAID_FILE" ]; then
          sed -i 's|GameData\.Enemy target = null;|Enemy target = null;|g' "$RAID_FILE"
          grep -n "Enemy target = null;" "$RAID_FILE" && echo "✓ RaidScreen OK"
        else
          echo "✗ 没找到 RaidScreen 文件"
        fi

        echo ""
        echo "===== 检查所有 screen 里的 final GameState ====="
        grep -rn "final GameState" "$SCREEN_DIR" || echo "已无 final GameState"

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 下载 Gradle 8.2
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip
        echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH

    - name: 配置 Android 环境
      run: |
        SDK=/usr/local/lib/android/sdk
        echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
        echo "sdk.dir=$SDK" > local.properties

    - name: 安装 Android SDK 包
      run: |
        SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
        yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
        $SDKMANAGER "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

    - name: 构建 APK
      run: |
        set +e
        gradle assembleDebug --no-daemon 2>&1 | tee gradle.log
        STATUS=$?
        echo ""
        echo "================ 编译错误 ================"
        grep -B 1 -A 4 "error:" gradle.log | head -100 || echo "（无编译错误）"
        echo "=========================================="
        exit $STATUS

    - name: 查找 APK
      if: always()
      run: |
        find . -name "*.apk" -type f 2>/dev/null || echo "没找到 APK"
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "apk 目录不存在"

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: gunmu-town-apk
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          **/*.apk
        if-no-files-found: warn
