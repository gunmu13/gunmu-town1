name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: 解压 gunmu-town.zip
      run: |
        mkdir -p _extract
        unzip -q gunmu-town.zip -d _extract
        if [ -d "_extract/gunmu-town" ]; then
          cp -r _extract/gunmu-town/. .
        else
          cp -r _extract/. .
        fi
        rm -rf _extract
        echo "=== 根目录文件 ==="
        ls -la
        echo "=== java 源文件清单 ==="
        find app/src/main/java -name "*.java" 2>/dev/null

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 下载 Gradle 8.2
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip
        echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH

    - name: 配置 Android 环境
      run: |
        SDK=/usr/local/lib/android/sdk
        echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
        echo "sdk.dir=$SDK" > local.properties

    - name: 安装 Android SDK 包
      run: |
        SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
        yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
        $SDKMANAGER "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

    - name: 构建 APK
      run: |
        set +e
        gradle assembleDebug --no-daemon 2>&1 | tee gradle.log
        STATUS=$?
        echo ""
        echo "================ 错误摘要 ================"
        grep -A 30 "What went wrong" gradle.log || echo "（没有 What went wrong）"
        echo ""
        echo "================ 编译错误 ================"
        grep -B 2 -A 3 "error:" gradle.log || echo "（没有 error:）"
        echo ""
        echo "================ 失败任务 ================"
        grep "FAILED" gradle.log || echo "（没有 FAILED）"
        echo "=========================================="
        exit $STATUS

    - name: 查找 APK 文件
      if: always()
      run: |
        find . -name "*.apk" -type f 2>/dev/null || echo "没找到 APK"

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: gunmu-town-apk
        path: |
          **/app-debug.apk
          **/*.apk
        if-no-files-found: warn
