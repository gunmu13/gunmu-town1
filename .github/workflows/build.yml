name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # ========== 解压 zip ==========
    - name: Unzip Source
      run: |
        mkdir -p ./project
        unzip -q gunmu-town.zip -d ./project
        # 如果 zip 里套了一层 gunmu-town 文件夹，自动移到上层
        if [ -d "project/gunmu-town" ]; then
          mv project/gunmu-town/* project/
          mv project/gunmu-town/.[!.]* project/ 2>/dev/null || true
          rmdir project/gunmu-town
        fi
        ls -la ./project

    # ========== 环境准备 ==========
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # ========== 安装依赖 ==========
    - name: Install dependencies
      working-directory: ./project
      run: npm install

    # ========== Capacitor 打包 ==========
    - name: Add Android platform
      working-directory: ./project
      run: npx cap add android

    - name: Sync web files
      working-directory: ./project
      run: npx cap sync android

    # ========== 构建 APK ==========
    - name: Build APK
      working-directory: ./project/android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    # ========== 上传 APK ==========
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: gunmu-town-debug
        path: project/android/app/build/outputs/apk/debug/app-debug.apk
